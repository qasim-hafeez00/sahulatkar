[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk-gateway"
version = "0.1.0"
description = "gateway for SahulatKar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "reportlab>=4.2.0",
    "pyotp>=2.9.0",
    "cryptography>=42.0.0",
    "python-json-logger>=2.0.7",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "sk-shared==0.1.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.23.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
