[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk-notification-service"
version = "2.0.0"
description = "Notification & Tracking Service for SahulatKar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
    "jinja2>=3.1.0",
    "prometheus-client>=0.20.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "sk-shared",
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.23.0",
    "aiosqlite>=0.20.0",
    "respx>=0.21.0",
]

[project.scripts]
notification-consumer = "src.workers.notification_consumer:run_consumer"
reminder-worker = "src.workers.reminder_worker:fire_installment_reminders"
retry-worker = "src.workers.retry_worker:process_retry_queue"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
