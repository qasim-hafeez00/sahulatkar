[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk-product-service"
version = "0.1.0"
description = "product-service for SahulatKar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "openai>=1.14.0",
    "beautifulsoup4>=4.12.3",
    "playwright>=1.42.0",
    "playwright-stealth>=1.0.6",
    "sk-shared"
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.23.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
