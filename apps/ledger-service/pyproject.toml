[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk-ledger-service"
version = "0.1.0"
description = "ledger-service for SahulatKar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.1",
    "prometheus-client>=0.20.0",
    "sk-shared"
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.23.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
