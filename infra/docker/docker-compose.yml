version: "3.9"

x-python-service: &python-service
  build:
    context: ../../
    dockerfile: apps/${SERVICE_NAME}/Dockerfile
  env_file: ../../.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    pgbouncer:
      condition: service_started
  networks:
    - sahulatkar

services:
  # ─── DATA STORES ───
  postgres:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: sk-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: sahulatkar
      POSTGRES_USER: sk_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD:-localdev123}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sk_admin -d sahulatkar"]
      interval: 5s
      retries: 5
    networks: [sahulatkar]

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    container_name: sk-pgbouncer
    ports: ["6432:6432"]
    environment:
      DATABASE_URL: postgres://sk_admin:${PG_PASSWORD:-localdev123}@postgres:5432/sahulatkar
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "40"
      MIN_POOL_SIZE: "10"
      SERVER_TLS_SSLMODE: prefer
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sahulatkar]

  redis:
    image: redis:7.2-alpine
    container_name: sk-redis
    ports: ["6379:6379"]
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-localdev123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdev123}", "ping"]
      interval: 5s
      retries: 5
    networks: [sahulatkar]

  # ─── MICROSERVICES ───
  gateway:
    <<: *python-service
    container_name: sk-gateway
    ports: ["8000:8000"]
    environment:
      SERVICE_NAME: gateway
      DATABASE_URL: postgresql+asyncpg://sk_app:${PG_PASSWORD:-localdev123}@pgbouncer:6432/sahulatkar
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdev123}@redis:6379/0

  product-service:
    <<: *python-service
    container_name: sk-product-service
    ports: ["8001:8000"]
    environment:
      SERVICE_NAME: product-service
      DATABASE_URL: postgresql+asyncpg://sk_app:${PG_PASSWORD:-localdev123}@pgbouncer:6432/sahulatkar
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdev123}@redis:6379/1

  credit-engine:
    <<: *python-service
    container_name: sk-credit-engine
    ports: ["8002:8000"]
    environment:
      SERVICE_NAME: credit-engine
      DATABASE_URL: postgresql+asyncpg://sk_app:${PG_PASSWORD:-localdev123}@pgbouncer:6432/sahulatkar
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdev123}@redis:6379/2

  payment-orchestrator:
    <<: *python-service
    container_name: sk-payment-orchestrator
    ports: ["8003:8000"]
    environment:
      SERVICE_NAME: payment-orchestrator
      DATABASE_URL: postgresql+asyncpg://sk_app:${PG_PASSWORD:-localdev123}@pgbouncer:6432/sahulatkar
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdev123}@redis:6379/3

  ledger-service:
    <<: *python-service
    container_name: sk-ledger-service
    ports: ["8004:8000"]
    environment:
      SERVICE_NAME: ledger-service
      DATABASE_URL: postgresql+asyncpg://sk_app:${PG_PASSWORD:-localdev123}@pgbouncer:6432/sahulatkar
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdev123}@redis:6379/4

  notification-service:
    <<: *python-service
    container_name: sk-notification-service
    ports: ["8005:8000"]
    environment:
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://sk_app:${PG_PASSWORD:-localdev123}@pgbouncer:6432/sahulatkar
      REDIS_URL: redis://:${REDIS_PASSWORD:-localdev123}@redis:6379/5

  # ─── FRONTENDS ───
  web-customer:
    build:
      context: ../../apps/web-customer
    container_name: sk-web-customer
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    networks: [sahulatkar]

  web-admin:
    build:
      context: ../../apps/web-admin
    container_name: sk-web-admin
    ports: ["3001:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    networks: [sahulatkar]

volumes:
  pg_data:
  redis_data:

networks:
  sahulatkar:
    driver: bridge
