apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sk-production

resources:
  - ../../base
  - configmap.yaml
  - secrets.yaml
  - ingress.yaml
  - resource-quota.yaml

# NOTE: cluster-issuer.yaml in this directory is deliberately NOT listed
# above - it is a cluster-scoped ClusterIssuer, and kustomize's namespace
# transformer would incorrectly stamp it with `namespace: sk-production`.
# Apply it separately, once per cluster, via:
#   kubectl apply -f infra/k8s/overlays/production/cluster-issuer.yaml
# See the comment at the top of that file for details.
