# Public entry point for the staging environment. Only the services that are
# meant to be reachable from outside the cluster are routed here (gateway is
# the API front door for everything else - product-service, credit-engine,
# payment-orchestrator, ledger-service, notification-service are internal
# ClusterIP-only services that gateway calls over cluster DNS with a signed
# X-Internal-Token, per apps/gateway/src/core/http_client.py, and are
# intentionally NOT exposed here).
#
# Hostnames:
#   - staging-api.sahulatkar.com is CONFIRMED from .github/workflows/build-and-push.yml
#     (GATEWAY_URL smoke-test env var) and infra/k8s/overlays/staging/configmap.yaml
#     (gateway_public_url).
#   - staging.sahulatkar.com / staging-admin.sahulatkar.com are DERIVED from that
#     pattern for web-customer/web-admin - NOT independently confirmed anywhere
#     in CI or configmaps. Verify/adjust before relying on them.
#
# Requires an nginx ingress controller (IngressClass "nginx") and cert-manager
# to already be installed in-cluster (manual `helm install` bootstrap step,
# see repo runbook) and the ClusterIssuer in cluster-issuer.yaml in this same
# directory to already be applied (that file is intentionally NOT part of this
# kustomization - see the comment at the top of cluster-issuer.yaml for why).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sk-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging-api.sahulatkar.com
        - staging.sahulatkar.com
        - staging-admin.sahulatkar.com
      secretName: sk-staging-tls
  rules:
    - host: staging-api.sahulatkar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
    - host: staging.sahulatkar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-customer
                port:
                  number: 80
    - host: staging-admin.sahulatkar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-admin
                port:
                  number: 80
