# PLACEHOLDER VALUES ONLY.
#
# These Secret manifests exist so `kustomize build` / `kubectl apply -k`
# succeed structurally (every Deployment's secretKeyRef needs a matching
# Secret+key to exist). The values below are dummies and MUST be replaced
# before a real deploy — e.g. via `kubectl create secret generic <name>
# --from-literal=<key>=<value> -n sk-staging --dry-run=client -o yaml |
# kubectl apply -f -`, or by wiring this cluster up to a real secrets
# manager (see the audit's Phase 3 note on external-secrets/OIDC).
apiVersion: v1
kind: Secret
metadata:
  name: sk-db-credentials
type: Opaque
stringData:
  database_url: "CHANGEME-postgresql+asyncpg://sk_app:changeme@pgbouncer:6432/sahulatkar"
  pgbouncer_upstream_url: "CHANGEME-postgres://sk_admin:changeme@postgres-staging.internal:5432/sahulatkar"
---
apiVersion: v1
kind: Secret
metadata:
  name: sk-redis-credentials
type: Opaque
stringData:
  gateway_url: "CHANGEME-redis://:changeme@redis-staging.internal:6379/0"
  product_service_url: "CHANGEME-redis://:changeme@redis-staging.internal:6379/1"
  credit_engine_url: "CHANGEME-redis://:changeme@redis-staging.internal:6379/2"
  payment_orchestrator_url: "CHANGEME-redis://:changeme@redis-staging.internal:6379/3"
  ledger_service_url: "CHANGEME-redis://:changeme@redis-staging.internal:6379/4"
  notification_service_url: "CHANGEME-redis://:changeme@redis-staging.internal:6379/5"
---
apiVersion: v1
kind: Secret
metadata:
  name: sk-jwt-keys
type: Opaque
stringData:
  jwt_private_key: "CHANGEME-generate-an-RSA-private-key-PEM"
  jwt_public_key: "CHANGEME-generate-an-RSA-public-key-PEM"
---
apiVersion: v1
kind: Secret
metadata:
  name: sk-internal-service-token
type: Opaque
stringData:
  internal_service_token: "CHANGEME-rotate-before-real-deploy"
  internal_api_token: "CHANGEME-rotate-before-real-deploy"
  internal_api_key: "CHANGEME-rotate-before-real-deploy"
