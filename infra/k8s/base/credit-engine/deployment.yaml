apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-engine
  labels:
    app: credit-engine
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credit-engine
  template:
    metadata:
      labels:
        app: credit-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sk-credit-engine
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: credit-engine
          image: sk-credit-engine:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "credit-engine"
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: sk-app-config
                  key: environment
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sk-app-config
                  key: log_level
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sk-db-credentials
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sk-redis-credentials
                  key: credit_engine_url
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: sk-jwt-keys
                  key: jwt_public_key
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: sk-jwt-keys
                  key: jwt_private_key
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sk-internal-service-token
                  key: internal_service_token
            - name: GATEWAY_URL
              value: "http://gateway:8000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
