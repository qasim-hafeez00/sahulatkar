apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  labels:
    app: ledger-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sk-ledger-service
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: ledger-service
          image: sk-ledger-service:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "ledger-service"
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: sk-app-config
                  key: environment
            # AWS Secrets Manager migration (docs/SECRETS_MANAGER_MIGRATION.md):
            # gates src/config.py::get_settings()'s Secrets Manager attempt.
            # Requires the sk-ledger-service ServiceAccount to be IRSA-annotated
            # with the secrets_manager_irsa_role_arns["ledger-service"] Terraform
            # output. This is the service the migration doc's own example was
            # written against.
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: sk-app-config
                  key: aws_region
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sk-app-config
                  key: log_level
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sk-db-credentials
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sk-redis-credentials
                  key: ledger_service_url
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
