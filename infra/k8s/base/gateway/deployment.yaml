apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        # gateway mounts its Instrumentator at /api/v1/metrics (see
        # src/core/metrics.py), not the bare /metrics path every other
        # service uses — the annotation must match or Prometheus scrapes
        # a 404 and this deployment silently produces no metrics.
        prometheus.io/path: "/api/v1/metrics"
    spec:
      serviceAccountName: sk-gateway
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: gateway
          image: sk-gateway:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "gateway"
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: sk-app-config
                  key: environment
            # AWS Secrets Manager migration (docs/SECRETS_MANAGER_MIGRATION.md):
            # gates src/config.py::get_settings()'s Secrets Manager attempt.
            # Requires the sk-gateway ServiceAccount to be IRSA-annotated with
            # the secrets_manager_irsa_role_arns["gateway"] Terraform output.
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: sk-app-config
                  key: aws_region
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sk-app-config
                  key: log_level
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sk-db-credentials
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sk-redis-credentials
                  key: gateway_url
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: sk-jwt-keys
                  key: jwt_public_key
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: sk-jwt-keys
                  key: jwt_private_key
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sk-internal-service-token
                  key: internal_service_token
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
