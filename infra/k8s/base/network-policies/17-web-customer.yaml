# web-customer (Next.js): same reasoning as web-admin — see
# 16-web-admin.yaml. overlays/*/ingress.yaml (Ingress/cert-manager Phase 3
# track) routes staging./sahulatkar.com here on Service port 80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-customer
spec:
  podSelector:
    matchLabels:
      app: web-customer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller's namespace isn't known from this repo (manual
    # install step). Left open cluster-wide-by-namespace; tighten to that
    # controller's actual namespace once it's installed.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8000
