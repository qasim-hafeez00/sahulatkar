# product-service: gateway kicks off extraction (POST /v1/products/extract,
# apps/gateway/src/services/order_service.py); product-service posts async
# results back to gateway's /internal/orders/{id}/product-extracted,
# /extraction-failed, /checkout-status, /shipment-register(ed) callbacks. It
# also scrapes arbitrary retailer product pages (Playwright/httpx —
# url_normalizer.py, form_filler.py, extractors/*) and calls OpenAI/
# BrightData/Rye/Violet/Groq/S3/captcha-solver APIs, so it needs broad
# outbound HTTP(S) egress by nature of the job, not just to fixed vendors.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-product-service
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
    # ASSUMPTION: Redis is external (see 10-gateway.yaml note). Port-scoped
    # only; tighten to the real CIDR once known.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
    # Product-page scraping + third-party API calls need broad outbound
    # HTTP/HTTPS — this service's entire job is fetching arbitrary retailer
    # URLs after SSRF validation (url_normalizer.py).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
