name: Build & Push

on:
  push:
    branches: [main, develop]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'apps/gateway/**'
              - 'packages/shared-python/**'
            product-service:
              - 'apps/product-service/**'
              - 'packages/shared-python/**'
            credit-engine:
              - 'apps/credit-engine/**'
              - 'packages/shared-python/**'
            payment-orchestrator:
              - 'apps/payment-orchestrator/**'
              - 'packages/shared-python/**'
            ledger-service:
              - 'apps/ledger-service/**'
              - 'packages/shared-python/**'
            notification-service:
              - 'apps/notification-service/**'
              - 'packages/shared-python/**'
            web-customer:
              - 'apps/web-customer/**'
            web-admin:
              - 'apps/web-admin/**'

  build-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && secrets.AWS_ACCESS_KEY_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/sk-${{ matrix.service }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/sk-{1}:latest', env.ECR_REGISTRY, matrix.service) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && secrets.AWS_ACCESS_KEY_ID != ''
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update staging manifests
        run: |
          # Ensure kustomize is installed
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
          mv kustomize /usr/local/bin/
          
          cd infra/k8s/overlays/staging
          for service in ${{ join(fromJson(needs.detect-changes.outputs.services), ' ') }}; do
            kustomize edit set image sk-$service=${{ env.ECR_REGISTRY }}/sk-$service:${{ github.sha }}
          done

      - name: Deploy to EKS Staging
        run: |
          aws eks update-kubeconfig --name sk-staging
          kubectl apply -k infra/k8s/overlays/staging

  smoke-test:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: always() && needs.deploy-staging.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: pip install httpx pytest pytest-asyncio
      - name: Run Smoke Tests
        env:
          GATEWAY_URL: https://staging-api.sahulatkar.com
        run: pytest tests/smoke/test_health.py -v

  deploy-production:
    needs: smoke-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.AWS_ACCESS_KEY_ID != ''
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update production manifests
        run: |
          # Ensure kustomize is installed
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
          mv kustomize /usr/local/bin/

          cd infra/k8s/overlays/production
          for service in ${{ join(fromJson(needs.detect-changes.outputs.services), ' ') }}; do
            kustomize edit set image sk-$service=${{ env.ECR_REGISTRY }}/sk-$service:${{ github.sha }}
          done

      - name: Deploy to EKS Production
        run: |
          aws eks update-kubeconfig --name sk-production
          kubectl apply -k infra/k8s/overlays/production
