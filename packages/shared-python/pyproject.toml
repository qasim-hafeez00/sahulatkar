[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk-shared"
version = "0.1.0"
description = "Shared components for SahulatKar backend"
authors = [{name = "SahulatKar", email = "eng@sahulatkar.pk"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "arq>=0.26.0",
    "redis>=5.0.3",
    "pydantic-settings>=2.2.1",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
]

[tool.hatch.build.targets.wheel]
packages = ["sk_shared"]

[project.optional-dependencies]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
]
